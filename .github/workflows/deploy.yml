# Verifie le projet, puis publie le jeu sur GitHub Pages.
#
# Le prototype est entierement statique (aucun serveur, aucun asset externe) :
# le `dist/` produit par Vite se deploie tel quel. `base: './'` est fixe dans
# vite.config.ts, ce qui rend le build independant du sous-chemin d'URL —
# indispensable puisque Pages sert le site depuis /Ultima7like/.

name: Verification et publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; on ne coupe pas un deploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verifier:
    name: Types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Verification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Preparer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Active Pages automatiquement si ce n'est pas deja fait.
          enablement: true

      - name: Televerser le site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    name: Publication
    if: github.event_name != 'pull_request'
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
