<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultima7like — prototype de moteur</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0a08;
        color: #d8c9a3;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; display: block; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.55;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">
      Deplacement&nbsp;: fleches / ZQSD ou clic &nbsp;·&nbsp; Interagir&nbsp;: double-clic
      &nbsp;·&nbsp; Sac&nbsp;: I &nbsp;·&nbsp; Fermer&nbsp;: Echap
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
